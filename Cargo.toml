[package]
name = "photoview"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "ico"] }
log = "0.4"
env_logger = "0.11"
rfd = "0.14"
directories = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = "0.4"
winreg = "0.52"
tobj = "4.0"
stl_io = "0.7"
gltf = "1.4"
glam = "0.29"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
wgpu = "0.20"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "photoview"
path = "src/main.rs"

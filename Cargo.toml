[package]
name = "dadaview"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "DaDaView — Windows image viewer with 3D model preview"
repository = "https://github.com/LiuFenCN/dadaview"
readme = "README.md"

[dependencies]
eframe = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "ico"] }
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = "0.4"
winreg = "0.52"
tobj = "4.0"
gltf = "1.4"
glam = "0.29"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
wgpu = "0.20"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_System_Threading"] }

[profile.dev]
# debug 下 image/wgpu 解码渲染极慢，轻微优化换取可用手感（编译开销增加很小）
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "dadaview"
path = "src/main.rs"
